spec:
  containers:
    - name: console
      image: /oee_db/containers/oee_repository/forgepulse-console:latest
      env:
        SNOWFLAKE_WAREHOUSE: OEE_WH
        SNOWFLAKE_DATABASE: OEE_DB
        SNOWFLAKE_SCHEMA: ANALYTICS
      resources:
        requests:
          cpu: 0.5
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi
      readinessProbe:
        port: 8000
        path: /health
  endpoints:
    - name: console
      port: 8000
      public: true
