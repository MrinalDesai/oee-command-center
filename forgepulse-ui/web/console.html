<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForgePulse — IoT Monitoring</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080c11;--bar:#0a0f16;--panel:#0d141d;--panel2:#0a1018;--line:#1b2634;--ink:#e8eef5;
    --mute:#8494a7;--dim:#4a5a6a;--green:#22c55e;--red:#ef4444;--redglow:rgba(239,68,68,.5);
    --amber:#f59e0b;--blue:#3b9eff;--cyan:#38bdf8;--violet:#a78bfa;
    --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px}
  .mono{font-family:var(--mono)}
  .topbar{display:flex;align-items:center;gap:28px;background:var(--bar);
    border-bottom:1px solid var(--line);padding:0 20px;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.02em}
  .logo .mark{width:30px;height:30px;border:2.5px solid var(--blue);border-radius:8px;position:relative;
    box-shadow:0 0 12px rgba(59,158,255,.4)}
  .logo .mark::after{content:'';position:absolute;inset:6px;border:2px solid var(--blue);border-radius:3px}
  .logo small{display:block;font-size:9.5px;color:var(--blue);letter-spacing:.18em;font-weight:600}
  .kv{border-left:1px solid var(--line);padding-left:24px}
  .kv .k{font-size:10px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
  .kv .v{font-size:15px;font-weight:700;margin-top:2px}
  .kv .v.on{color:var(--green)}.kv .v.on::before{content:'● ';font-size:11px}
  .topbar .right{margin-left:auto;display:flex;gap:18px;align-items:center}
  .bell{position:relative;color:var(--mute);font-size:13px}
  .bell .n{position:absolute;top:-8px;right:-12px;background:var(--blue);color:#fff;font-size:10px;
    font-weight:700;border-radius:9px;padding:1px 6px}
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 64px)}
  .side{background:var(--bar);border-right:1px solid var(--line);padding:18px 0;display:flex;flex-direction:column}
  .side .eyebrow{font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;padding:0 20px;margin:6px 0 8px}
  .nav a{display:flex;gap:11px;align-items:center;color:var(--mute);text-decoration:none;
    padding:10px 20px;font-weight:600;font-size:13px;border-left:3px solid transparent}
  .nav a.cur{color:var(--ink);background:rgba(59,158,255,.08);border-left-color:var(--blue)}
  .nav a:hover{color:var(--ink)}
  .nav .ic{width:16px;text-align:center}
  .details{margin-top:auto;border-top:1px solid var(--line);padding:16px 20px}
  .details .row{display:flex;justify-content:space-between;margin:7px 0;font-size:12px}
  .details .row .k{color:var(--mute)}
  .details .row .v{font-weight:600}
  .details .row .v.link{color:var(--blue)}
  .main{padding:18px 24px;overflow-y:auto;max-height:calc(100vh - 64px)}
  .feedhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .feedhead h2{font-size:17px;font-weight:700}
  .pill{font-size:10px;font-weight:700;letter-spacing:.08em;color:#052e13;background:var(--green);
    border-radius:12px;padding:4px 11px;box-shadow:0 0 12px rgba(34,197,94,.35)}
  .legend{display:flex;gap:18px;font-size:12px;color:var(--mute);margin:2px 0 8px}
  .legend b{color:var(--ink)}
  .legend .sw{color:var(--blue)}
  .chartcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .wavebox{position:relative}
  .banner{position:absolute;top:8px;background:var(--red);color:#fff;font-size:12px;font-weight:700;
    padding:7px 13px;border-radius:6px;box-shadow:0 0 20px var(--redglow);display:none;z-index:2}
  canvas{display:block;width:100%}
  .scrub{margin-top:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:3px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
    display:flex;justify-content:space-between;align-items:flex-end}
  .stat .k{font-size:10.5px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
  .stat .v{font-size:22px;font-weight:700;margin-top:6px;font-family:var(--mono)}
  .spark{width:64px;height:26px}
  .sect{font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin:22px 0 10px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .lineRow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;background:var(--panel2);margin-bottom:10px;flex-wrap:wrap}
  .lineTag{font-size:10px;letter-spacing:.2em;color:var(--mute)}
  .machine{cursor:pointer;text-align:center;position:relative;background:none;border:none;padding:5px;font-family:var(--sans)}
  .machine .mid{font-size:10px;color:var(--mute);margin-top:3px;font-family:var(--mono)}
  .machine.sel .mid{color:var(--blue)}
  .machine .fault{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--red);
    color:#fff;font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;
    box-shadow:0 0 12px var(--redglow)}
  .g-healthy{filter:drop-shadow(0 0 5px rgba(34,197,94,.5))}
  .g-critical{filter:drop-shadow(0 0 9px var(--redglow));animation:pulse 2s infinite}
  .g-watch{filter:drop-shadow(0 0 7px rgba(245,158,11,.6))}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.82}}
  .flow{display:flex;align-items:center;margin:6px 0;flex-wrap:wrap}
  .node{border:2px solid var(--line);border-radius:7px;padding:9px 15px;font-size:11.5px;
    font-family:var(--mono);background:var(--pan2);background:var(--panel2);color:var(--dim);white-space:nowrap}
  .node.done{border-color:var(--green);color:var(--ink);box-shadow:0 0 13px rgba(34,197,94,.35)}
  .node.now{border-color:var(--red);color:var(--ink);box-shadow:0 0 13px var(--redglow);animation:pulse 2s infinite}
  .edge{width:52px;height:2px;background:var(--line)}
  .edge.lit{background:repeating-linear-gradient(90deg,var(--green) 0 6px,transparent 6px 12px);
    animation:flow 1s linear infinite;box-shadow:0 0 8px rgba(34,197,94,.4)}
  @keyframes flow{to{background-position:-12px 0}}
  .tick{color:var(--green);font-size:11px;margin-left:6px}
  .sev{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;font-family:var(--mono)}
  .sev.HIGH{background:rgba(239,68,68,.14);color:var(--red);border:1px solid var(--red)}
  .sev.MEDIUM{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid var(--amber)}
  .ticker{position:sticky;bottom:0;margin:20px -24px -18px;background:var(--bar);
    border-top:1px solid var(--line);padding:11px 24px;display:flex;gap:22px;align-items:center;font-size:12px;flex-wrap:wrap}
  .ticker .hd{color:var(--red);font-weight:700}
  .ticker .item{display:flex;gap:9px;align-items:center;color:var(--mute)}
  .ticker .item b{color:var(--ink)}
  .ticker .dot{color:var(--red)}
  .tabsrow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .tabsrow button{font-family:var(--mono);cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    color:var(--mute);border-radius:7px;padding:7px 12px;font-size:11.5px}
  .tabsrow button.cur{border-color:var(--blue);color:var(--blue);background:rgba(59,158,255,.08)}
  .tabsrow button:focus-visible{outline:2px solid var(--blue)}
  @media (prefers-reduced-motion:reduce){.g-critical,.node.now,.edge.lit{animation:none}}
  @media (max-width:940px){.layout{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.details{margin:0}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><div class="mark"></div><div>FORGEPULSE<small>IoT MONITORING</small></div></div>
  <div class="kv"><div class="k">System Status</div><div class="v on">ONLINE</div></div>
  <div class="kv"><div class="k">Last Update</div><div class="v mono" id="clock">—</div></div>
  <div class="kv"><div class="k">Uptime</div><div class="v mono" id="uptime">—</div></div>
  <div class="right"><span class="bell">🔔 Alerts<span class="n" id="acount">0</span></span></div>
</div>
<div class="layout">
  <aside class="side">
    <div class="eyebrow">Dashboard</div>
    <nav class="nav">
      <a class="cur" href="#"><span class="ic">〜</span>Live Monitor</a>
      <a href="#floorsect"><span class="ic">⚙</span>Plant Floor</a>
      <a href="#pipesect"><span class="ic">➔</span>Fault Pipeline</a>
      <a href="#alertsect"><span class="ic">🔔</span>Alerts</a>
    </nav>
    <div class="details">
      <div class="eyebrow" style="padding:0;margin-bottom:10px">Sensor Details</div>
      <div class="row"><span class="k">Asset ID</span><span class="v link" id="d_id">—</span></div>
      <div class="row"><span class="k">Location</span><span class="v" id="d_loc">—</span></div>
      <div class="row"><span class="k">Parameter</span><span class="v" id="d_param">—</span></div>
      <div class="row"><span class="k">Cadence</span><span class="v mono">1 Hz</span></div>
      <div class="row"><span class="k">Status</span><span class="v" id="d_status">—</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="feedhead"><h2>LIVE SENSOR FEED</h2><span class="pill">REAL-TIME</span></div>
    <div class="tabsrow" id="sensortabs"></div>
    <div class="legend" id="legend"></div>
    <div class="chartcard">
      <div class="wavebox">
        <div class="banner" id="banner">⚠ ABNORMAL PATTERN DETECTED</div>
        <canvas id="wave" width="1180" height="330" role="img" aria-label="Live waveform"></canvas>
      </div>
      <div class="scrub"><canvas id="scrub" width="1180" height="34"></canvas></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="sect" id="floorsect">Plant Floor</div>
    <div id="floor"></div>
    <div class="sect" id="pipesect">Fault Pipeline</div>
    <div class="card" id="pipes"></div>
    <div class="ticker" id="ticker"></div>
  </main>
</div>
<script>
const SENSORS=[["VIBRATION_RMS","Vibration (mm/s)"],["BEARING_TEMP","Temp (°C)"],["RPM","RPM"],["CURRENT_DRAW","Current (A)"]];
const STAGES=["DETECT","DIAGNOSE","ACT","WORK ORDER"];
const COLORS={healthy:"#22c55e",watch:"#f59e0b",critical:"#ef4444","sensor-fault":"#a78bfa"};
let motor="AST-007", sensor="VIBRATION_RMS", assets=[], faultMap={}, boot_t=Date.now();
const $=id=>document.getElementById(id);
const j=async u=>{const r=await fetch(u);if(!r.ok)throw u;return r.json()};
setInterval(()=>{
  $("clock").textContent=new Date().toLocaleTimeString();
  const s=Math.floor((Date.now()-boot_t)/1000);
  $("uptime").textContent=Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m "+(s%60)+"s";
},1000);
function motorSVG(color){return '<svg width="78" height="48" viewBox="0 0 86 52" aria-hidden="true">'
 +'<rect x="6" y="12" width="52" height="30" rx="6" fill="#0a1018" stroke="'+color+'" stroke-width="2"/>'
 +'<rect x="58" y="19" width="10" height="16" rx="2" fill="#0a1018" stroke="'+color+'" stroke-width="2"/>'
 +'<rect x="68" y="23" width="12" height="8" rx="2" fill="'+color+'"/>'
 +'<line x1="12" y1="12" x2="12" y2="42" stroke="'+color+'" stroke-width="1" opacity=".4"/>'
 +'<line x1="20" y1="12" x2="20" y2="42" stroke="'+color+'" stroke-width="1" opacity=".4"/>'
 +'<line x1="28" y1="12" x2="28" y2="42" stroke="'+color+'" stroke-width="1" opacity=".4"/>'
 +'<rect x="14" y="42" width="10" height="5" fill="'+color+'" opacity=".7"/>'
 +'<rect x="40" y="42" width="10" height="5" fill="'+color+'" opacity=".7"/></svg>'}
function renderTabs(){
  $("sensortabs").innerHTML=SENSORS.map(function(s){
    return '<button class="'+(s[0]===sensor?'cur':'')+'" onclick="sensor=\''+s[0]+'\';renderTabs();draw()">'+s[1]+'</button>'}).join("");
}
function renderDetails(){
  const a=assets.find(x=>x.asset_id===motor);if(!a)return;
  $("d_id").textContent=a.asset_id;$("d_loc").textContent=a.name;
  $("d_param").textContent=SENSORS.find(s=>s[0]===sensor)[1];
  const st=$("d_status");st.textContent=a.status.toUpperCase();st.style.color=COLORS[a.status];
}
function renderFloor(){
  const lines={};assets.forEach(a=>{(lines[a.line]=lines[a.line]||[]).push(a)});
  $("floor").innerHTML=Object.keys(lines).sort().map(function(ln){
    return '<div class="lineRow"><span class="lineTag">LINE '+ln+'</span>'+lines[ln].map(function(a){
      const f=faultMap[a.asset_id];
      return '<button class="machine '+(a.asset_id===motor?'sel':'')+'" aria-label="'+a.asset_id+' '+a.status+'"'
        +' onclick="motor=\''+a.asset_id+'\';renderFloor();renderDetails();draw()">'
        +(f?'<span class="fault">'+f+'</span>':'')
        +'<span class="g-'+(a.status==='sensor-fault'?'watch':a.status)+'">'+motorSVG(COLORS[a.status]||'#4a5a6a')+'</span>'
        +'<div class="mid">'+a.asset_id+'</div></button>'}).join("")+'</div>'}).join("");
}
function drawSpark(c,vals,color){
  const x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);
  const lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),sp=(hi-lo)||1;
  x.beginPath();vals.forEach(function(v,i){const px=i/(vals.length-1)*W,py=H-((v-lo)/sp)*(H-4)-2;
    i?x.lineTo(px,py):x.moveTo(px,py)});
  x.strokeStyle=color;x.lineWidth=1.3;x.stroke();
}
// ── live scope: ring buffer of dense samples, amplitude = real data / baseline ──
let live=null, ring=[], RING=700;
async function fetchLive(){
  try{
    const d=await j("/api/live/"+motor+"?sensor="+sensor);
    const changed=!live||live.asset_id!==d.asset_id||live.sensor!==d.sensor;
    live=d; if(changed) ring=[];
    renderDetails();
    const label=SENSORS.find(s=>s[0]===sensor)[1];
    $("legend").innerHTML='<span class="sw">— <b>'+label+'</b></span>'
      +'<span>RMS: <b>'+d.stats.rms+'</b></span><span>Peak: <b>'+d.stats.peak+'</b></span>'
      +'<span>Avg: <b>'+d.stats.avg+'</b></span>'
      +'<span style="color:var(--mute);font-size:10px">display envelope: live values × baseline</span>';
    const tail=d.points.slice(-40);
    $("cards").innerHTML=[["RMS",d.stats.rms],["PEAK",d.stats.peak],["AVG",d.stats.avg],
      ["BASELINE",d.baseline.toFixed(2)]].map(function(kv,i){
      return '<div class="stat"><div><div class="k">'+kv[0]+'</div><div class="v">'+kv[1]+'</div></div>'
        +'<canvas class="spark" id="sp'+i+'" width="64" height="26"></canvas></div>'}).join("");
    [0,1,2,3].forEach(i=>drawSpark($("sp"+i),tail,"#22c55e"));
  }catch(e){}
}
function gauss(){let t=0;for(let i=0;i<4;i++)t+=Math.random();return (t-2)/1.2}
function drawFrame(){
  requestAnimationFrame(drawFrame);
  const c=$("wave");if(!c)return;
  const x=c.getContext("2d"),W=c.width,H=c.height,mid=H/2;
  if(live){
    const raw=live.points,n=raw.length,
      base=(live.baseline&&live.baseline>0)?live.baseline:1;
    const ratio=raw[n-1]/base;             // current real severity
    const hot=ratio>=2.0;
    for(let k=0;k<3;k++){                  // 3 samples/frame ≈ 180 Hz display
      const spike=(Math.random()<0.006)?(2.2+Math.random()*1.5):1;
      ring.push({v:gauss()*spike, r:ratio, hot:hot});
    }
    while(ring.length>RING) ring.shift();
  }
  x.clearRect(0,0,W,H);
  x.strokeStyle="#16202c";x.lineWidth=.6;x.setLineDash([3,4]);
  for(let i=1;i<8;i++){x.beginPath();x.moveTo(0,i*H/8);x.lineTo(W,i*H/8);x.stroke()}
  for(let i=1;i<12;i++){x.beginPath();x.moveTo(i*W/12,0);x.lineTo(i*W/12,H);x.stroke()}
  x.setLineDash([]);
  if(!ring.length)return;
  const m=ring.length, MAXR=4;
  const px=i=>i/(RING-1)*W + (RING-m)/(RING-1)*W*0; // fill from left as buffer grows
  const amp=r=>Math.min(r,MAXR)/MAXR*(mid-14);
  const Y=s=>mid - s.v*amp(s.r)*0.45;
  // hot region box from buffer
  let h0=-1,h1=-1;
  for(let i=0;i<m;i++){if(ring[i].hot){if(h0<0)h0=i;h1=i}}
  if(h0>=0){
    const X0=h0/(RING-1)*W, X1=Math.max(h1/(RING-1)*W, X0+30);
    x.fillStyle="rgba(239,68,68,.10)";x.fillRect(X0,0,X1-X0,H);
    x.strokeStyle="#ef4444";x.setLineDash([6,5]);x.lineWidth=1.4;
    x.strokeRect(X0,1,X1-X0,H-2);x.setLineDash([]);
    const b=$("banner");b.style.display="block";
    b.style.left=Math.min(X0,W*.55)/W*100+"%";
    b.textContent="⚠ "+((live&&live.anomaly[0]&&live.anomaly[0].label)||"ABNORMAL PATTERN DETECTED");
  } else $("banner").style.display="none";
  // blue pass (normal samples), then red pass (hot) — two simple paths
  x.lineWidth=1.3;
  x.strokeStyle="#3b9eff";x.beginPath();
  let pen=false;
  for(let i=0;i<m;i++){const s=ring[i];
    if(s.hot){pen=false;continue}
    const X=i/(RING-1)*W;
    pen?x.lineTo(X,Y(s)):x.moveTo(X,Y(s));pen=true}
  x.stroke();
  x.strokeStyle="#ef4444";x.lineWidth=1.6;x.shadowColor="#ef4444";x.shadowBlur=8;
  x.beginPath();pen=false;
  for(let i=0;i<m;i++){const s=ring[i];
    if(!s.hot){pen=false;continue}
    const X=i/(RING-1)*W;
    pen?x.lineTo(X,Y(s)):x.moveTo(X,Y(s));pen=true}
  x.stroke();x.shadowBlur=0;
  // scrubber: real values silhouette
  if(live){
    const raw=live.points,n=raw.length,
      base=(live.baseline&&live.baseline>0)?live.baseline:1;
    const sc=$("scrub"),sx=sc.getContext("2d");sx.clearRect(0,0,sc.width,sc.height);
    const mr=Math.max(...raw.map(v=>v/base),2.5);
    if(raw[n-1]/base>=2){sx.fillStyle="rgba(239,68,68,.22)";sx.fillRect(0,0,sc.width,sc.height)}
    sx.beginPath();
    for(let i=0;i<n;i++){const qx=i/(n-1)*sc.width,
      qy=sc.height-((raw[i]/base)/mr)*(sc.height-6)-3;
      i?sx.lineTo(qx,qy):sx.moveTo(qx,qy)}
    sx.strokeStyle="#2b6cb0";sx.lineWidth=.8;sx.stroke();
  }
}
requestAnimationFrame(drawFrame);
function draw(){fetchLive()}
const stageIdx=s=>s==="NEW"?0:s==="INVESTIGATING"?1:s==="ACTIONED"?3:1;
function renderPipes(alerts){
  $("pipes").innerHTML=alerts.length?alerts.map(function(al){
    const idx=stageIdx(al.status);
    return '<div style="margin-bottom:12px">'
      +'<div style="font-size:12px;color:var(--mute);margin-bottom:6px">'
      +'<b style="color:var(--ink)" class="mono">'+al.asset_id+'</b> · '+al.probable_mode.replaceAll("_"," ")
      +' · <span class="sev '+al.severity+'">'+al.severity+'</span></div>'
      +'<div class="flow">'+STAGES.map(function(st,i){
        return (i?'<div class="edge '+(i<=idx?'lit':'')+'"></div>':'')
          +'<div class="node '+(i<idx?'done':i===idx?(al.status==='ACTIONED'?'done':'now'):'')+'">'+st
          +((i<idx||(i===idx&&al.status==='ACTIONED'))?'<span class="tick">✓</span>':'')+'</div>'}).join("")
      +'</div></div>'}).join("")
    :'<span style="color:var(--mute)">No active faults — plant nominal.</span>';
}
function renderTicker(alerts){
  $("acount").textContent=alerts.length;
  $("ticker").innerHTML='<span class="hd">ACTIVE ALERTS ('+alerts.length+') ▲</span>'
    +alerts.map(function(al){
      return '<span class="item"><span class="dot">●</span>'
        +'<span class="mono">'+new Date(al.detected_ts).toLocaleTimeString()+'</span>'
        +'<b class="mono">'+al.asset_id+'</b>'
        +'<span>'+al.probable_mode.replaceAll("_"," ").toLowerCase()+' detected</span>'
        +'<span class="sev '+al.severity+'">'+al.severity+'</span></span>'}).join("");
}
async function refreshMeta(){
  assets=await j("/api/assets");
  const alerts=await j("/api/alerts");
  faultMap={};alerts.forEach(al=>faultMap[al.asset_id]=al.probable_mode.replaceAll("_"," "));
  renderFloor();renderDetails();renderPipes(alerts);renderTicker(alerts);
}
